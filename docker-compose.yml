services:

  mysql:
    image: mysql:8.0
    container_name: department-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ayushi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - department-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-payushi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: department-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - department-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: department-config:1.0
    container_name: department-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - department-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: department-eureka:1.0
    container_name: department-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_started
    networks:
      - department-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: department-auth:1.0
    container_name: department-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - department-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: department-user:1.0
    container_name: department-user
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - department-network

  master-service:
    build:
      context: .
      dockerfile: master-service/Dockerfile
    image: department-master-service:1.0
    container_name: department-master-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - department-network

  department-service:
    build:
      context: .
      dockerfile: department-master/Dockerfile
    image: department-service:1.0
    container_name: department-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      master-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - department-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: department-gateway:1.0
    container_name: department-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - department-network

volumes:
  mysql_data:
  redis_data:

networks:
  department-network:
    driver: bridge