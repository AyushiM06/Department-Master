server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: department-service
              uri: lb://DEPARTMENT-MASTER
              predicates:
                - Path=/department/**

            - id: master-service
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/master/**

            - id: employee-master
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/employee/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}