spring:
  application:
    name: department-master

  datasource:
    url: jdbc:mysql://localhost:3306/department_management
    username: root
    password: ${DEPARTMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ayushim@dreamsol.biz
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

department:
  notification:
    email: ayushim@dreamsol.biz

jwt:
  secret: ${JWT_SECRET}

master-service:
  url: http://localhost:8083

user-service:
  url: http://localhost:8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true